# Glossary
#
# Plain-language definitions for terms that appear on screens but aren't
# learning objectives in concepts.yaml (sector metrics, market mechanics).
# Tapping one of these terms anywhere in the app opens its definition.
# Concepts are tracked for ranks; glossary terms are not.
#
# Fields
#   slug         stable id
#   term         display name
#   explanation  1-2 sentences for a 13-year-old with no investing background
#   example      optional, with real-looking numbers

terms:

  - slug: gross-margin
    term: Gross margin
    explanation: >
      How much of each $1 of sales is left after paying for the product itself
      (materials, factory work), before paying for things like offices, ads and research.
    example: >
      Nvidia keeps about 72 cents of every $1 of chip sales after paying to make the
      chips. A grocery store might keep 13 cents.

  - slug: operating-margin
    term: Operating margin
    explanation: >
      How much of each $1 of sales is left after paying for running the whole
      business (products, workers, rent, ads), but before interest and taxes.

  - slug: same-store-sales
    term: Same-store sales
    explanation: >
      Whether the stores or restaurants that were already open a year ago are selling
      more or less than they did then. It strips out growth from just opening new
      locations.
    example: >
      A chain grows sales 10%, but only because it opened 50 new restaurants. If the
      old ones sold 2% less, its same-store sales are down 2%.

  - slug: backlog
    term: Order backlog
    explanation: >
      Orders customers have already signed contracts for but haven't been delivered
      yet. A big backlog means years of work are already lined up.
    example: >
      A defense company with a $166 billion backlog and $73 billion of sales a year
      has more than two years of work already booked.

  - slug: organic-growth
    term: Organic sales growth
    explanation: >
      How much sales grew from the company's own business, not counting companies it
      bought or changes in currency exchange rates.

  - slug: customer-retention
    term: Customer retention
    explanation: >
      The share of customers who stay from one year to the next. For software that
      people pay for every month, keeping customers is cheaper than finding new ones.

  - slug: subscribers-churn
    term: Subscriber growth and churn
    explanation: >
      Subscriber growth is how many more people are paying than last year. Churn is
      the share who cancel each month. A service can add lots of people and still
      struggle if many of them leave.

  - slug: inventory
    term: Inventory
    explanation: >
      Products a store has bought but hasn't sold yet. If inventory grows much faster
      than sales, the store may have to cut prices to clear it out.

  - slug: cash-conversion
    term: Cash conversion
    explanation: >
      How much of a company's reported profit shows up as actual cash. Above 100% means
      more cash came in than the profit number says.

  - slug: earnings-report
    term: Earnings report
    explanation: >
      Every 3 months, each public company reports its sales, profits and other numbers
      for the last quarter. Stocks often move a lot that day. In this game, it's when
      your thesis prediction gets checked.

  - slug: quarter
    term: Quarter
    explanation: >
      Three months. Companies report their results four times a year, once per quarter.

  - slug: eps
    term: Earnings per share (EPS)
    explanation: >
      A company's profit divided by its number of shares: how much profit belongs to
      each single share.

  - slug: closing-price
    term: Closing price
    explanation: >
      The last price a stock trades at when the market closes for the day, at 4pm New
      York time. In this game every trade goes through at the closing price, so there's
      no reason to watch prices all day.

  - slug: index-fund
    term: Index fund
    explanation: >
      One fund that owns a small piece of every company in an index. An S&P 500 index
      fund owns a slice of the 500 biggest US companies, so it moves with the whole
      market.
