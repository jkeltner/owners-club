# Company lines
#
# The name players see and one plain line on what the company does, for the
# companies the onboarding themes point at (content/themes.yaml). Every other
# company in the game shows its official name, tidied, and its industry until
# it gets a line here.
#
# Rules for a line: what you'd recognize the company by, in a few words. No
# opinion, no numbers that go stale, nothing that sounds like a reason to buy.

companies:
  NVDA: { name: Nvidia, line: Makes the chips that power AI }
  MSFT: { name: Microsoft, line: "Windows, Xbox, and the cloud behind ChatGPT" }
  GOOGL: { name: Alphabet (Google), line: "Google search, YouTube, and Gemini AI" }
  META: { name: Meta, line: "Instagram, WhatsApp, Facebook and Meta AI" }
  AMZN: { name: Amazon, line: "Online shopping, Prime Video and the AWS cloud" }
